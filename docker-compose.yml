services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: user-management-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev123!"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - user_management_sqlserver_data:/var/opt/mssql

volumes:
  user_management_sqlserver_data:
